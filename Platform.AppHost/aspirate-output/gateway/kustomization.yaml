resources:
- deployment.yaml
- service.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
- name: gateway-env
  literals:
    - OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES=true
    - OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES=true
    - OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY=in_memory
    - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
    - HTTP_PORTS=8080;8000
    - services__auth-api__http__0=http://auth-api:8080
    - services__cicd-api__http__0=http://cicd-api:8080
    - services__registry-api__http__0=http://registry-api:8080
    - services__telemetry-api__http__0=http://telemetry-api:8080
    - services__secrets-api__http__0=http://secrets-api:8080
    - services__aggregator__http__0=http://aggregator:8080
    - services__keycloak__http__0=http://keycloak:8080
    - services__keycloak__management__0=keycloak:9000
    - ASPNETCORE_ENVIRONMENT=Staging
    - ASPNETCORE_URLS=http://+:8080;

secretGenerator:
- name: gateway-secrets
  envs:
  - .gateway.secrets


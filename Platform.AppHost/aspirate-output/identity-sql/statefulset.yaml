---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: identity-sql
  labels:
    app: identity-sql
spec:
  serviceName: "identity-sql"
  replicas: 1
  selector:
    matchLabels:
      app: identity-sql
  template:
    metadata:
      labels:
        app: identity-sql
    spec:
      containers:
        - name: identity-sql
          image: mcr.microsoft.com/mssql/server:2022-latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1433
          envFrom:
            - configMapRef:
                name: identity-sql-env
            - secretRef:
                name: identity-sql-secrets
          volumeMounts:
            - name: platform-apphost-04e9402f01-identity-sql-data
              mountPath: /var/opt/mssql
  volumeClaimTemplates:
    - metadata:
        name: platform-apphost-04e9402f01-identity-sql-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

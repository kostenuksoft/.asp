---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregator
  labels:
    app: aggregator
spec:
  minReadySeconds: 60
  replicas: 1
  selector:
    matchLabels:
      app: aggregator
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: aggregator
    spec:
      containers:
      - name: aggregator
        image: localhost:5000/aggregator:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        - name: https
          containerPort: 8443
        envFrom:
        - configMapRef:
            name: aggregator-env
        - secretRef:
            name: aggregator-secrets
      terminationGracePeriodSeconds: 180